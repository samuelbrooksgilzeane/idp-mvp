[project]
name = "idp-app"
version = "0.1.0"
description = "Backend services for the IDP MVP."
requires-python = ">=3.11"
dependencies = [
  "databricks-sdk==0.133.0",
  "fastapi==0.116.1",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.32",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pyyaml==6.0.2",
  "ruff==0.12.11",
  "types-pyyaml==6.0.12.20250822",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idp_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
