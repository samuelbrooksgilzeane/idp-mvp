resources:
  jobs:
    governed_data_bootstrap:
      name: ${var.app_name}-${bundle.target}-governed-data-bootstrap
      description: Idempotently creates the IDP project schema, volumes, tables, and views.
      tasks:
        - task_key: create_governed_objects
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../sql/create_objects.sql
            parameters:
              catalog: ${var.catalog}
              project_schema: ${var.project_schema}
              table_prefix: ${var.table_prefix}
              source_volume_name: ${var.source_volume_name}
              artifacts_volume_name: ${var.artifacts_volume_name}
        - task_key: migrate_parsing_columns
          depends_on:
            - task_key: create_governed_objects
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../sql/migrate_parsing.sql
            parameters:
              catalog: ${var.catalog}
              project_schema: ${var.project_schema}
              table_prefix: ${var.table_prefix}
        - task_key: migrate_extraction_columns
          depends_on:
            - task_key: migrate_parsing_columns
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../sql/migrate_extraction.sql
            parameters:
              catalog: ${var.catalog}
              project_schema: ${var.project_schema}
              table_prefix: ${var.table_prefix}
        - task_key: register_production_schemas
          depends_on:
            - task_key: migrate_extraction_columns
          spark_python_task:
            python_file: ../src/register_schemas.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --project-schema
              - ${var.project_schema}
              - --table-prefix
              - ${var.table_prefix}
              - --manifest-path
              - ${workspace.file_path}/schemas/invoice_v1.json
          environment_key: default
        - task_key: register_production_schemas_v2
          depends_on:
            - task_key: register_production_schemas
          spark_python_task:
            python_file: ../src/register_schemas.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --project-schema
              - ${var.project_schema}
              - --table-prefix
              - ${var.table_prefix}
              - --manifest-path
              - ${workspace.file_path}/schemas/invoice_v2.json
          environment_key: default
        - task_key: register_production_schemas_v3
          depends_on:
            - task_key: register_production_schemas_v2
          spark_python_task:
            python_file: ../src/register_schemas.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --project-schema
              - ${var.project_schema}
              - --table-prefix
              - ${var.table_prefix}
              - --manifest-path
              - ${workspace.file_path}/schemas/invoice_v3.json
          environment_key: default
        - task_key: register_production_schemas_v4
          depends_on:
            - task_key: register_production_schemas_v3
          spark_python_task:
            python_file: ../src/register_schemas.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --project-schema
              - ${var.project_schema}
              - --table-prefix
              - ${var.table_prefix}
              - --manifest-path
              - ${workspace.file_path}/schemas/invoice_v4.json
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
