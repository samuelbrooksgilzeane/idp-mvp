resources:
  jobs:
    document_parser:
      name: ${var.app_name}-${bundle.target}-document-parser
      description: Parses registered PDFs into retained layout data and page images.
      max_concurrent_runs: 1
      parameters:
      - name: catalog
        default: ${var.catalog}
      - name: project_schema
        default: ${var.project_schema}
      - name: table_prefix
        default: ${var.table_prefix}
      - name: source_volume_name
        default: ${var.source_volume_name}
      - name: artifacts_volume_name
        default: ${var.artifacts_volume_name}
      - name: inputs
        default: '[]'
      - name: dispatch_id
        default: ''
      - name: warehouse_id
        default: ${var.warehouse_id}
      tasks:
      - task_key: load_work_manifest
        notebook_task:
          notebook_path: ../src/load_work_manifest.py
          base_parameters:
            catalog: '{{job.parameters.catalog}}'
            project_schema: '{{job.parameters.project_schema}}'
            table_prefix: '{{job.parameters.table_prefix}}'
            source_volume_name: '{{job.parameters.source_volume_name}}'
            artifacts_volume_name: '{{job.parameters.artifacts_volume_name}}'
            warehouse_id: '{{job.parameters.warehouse_id}}'
            dispatch_id: '{{job.parameters.dispatch_id}}'
            inputs: '{{job.parameters.inputs}}'
            repository_root: ${workspace.file_path}
            parse_concurrency: ${var.parse_concurrency}
            extraction_concurrency: ${var.extraction_concurrency}
            combined_budget: ${var.combined_inference_concurrency}
            work_kind: PARSE
        environment_key: default
        max_retries: 0
      - task_key: parse_manifest
        depends_on:
        - task_key: load_work_manifest
        for_each_task:
          inputs: '{{tasks.load_work_manifest.values.work_item_ids}}'
          concurrency: ${var.parse_concurrency}
          task:
            task_key: parse_claimed_document
            spark_python_task:
              python_file: ../src/parse_document.py
              parameters:
              - --viewer-projection-enabled
              - ${var.viewer_projection_enabled}
              - --catalog
              - '{{job.parameters.catalog}}'
              - --project-schema
              - '{{job.parameters.project_schema}}'
              - --table-prefix
              - '{{job.parameters.table_prefix}}'
              - --source-volume-name
              - '{{job.parameters.source_volume_name}}'
              - --artifacts-volume-name
              - '{{job.parameters.artifacts_volume_name}}'
              - --warehouse-id
              - '{{job.parameters.warehouse_id}}'
              - --dispatch-id
              - '{{job.parameters.dispatch_id}}'
              - --work-item-id
              - '{{input}}'
            environment_key: default
            max_retries: 0
      - task_key: parse_document_batch
        for_each_task:
          inputs: '{{job.parameters.inputs}}'
          concurrency: ${var.parse_concurrency}
          task:
            task_key: parse_registered_document
            spark_python_task:
              python_file: ../src/parse_document.py
              parameters:
              - --viewer-projection-enabled
              - ${var.viewer_projection_enabled}
              - --warehouse-id
              - '{{job.parameters.warehouse_id}}'
              - --catalog
              - '{{job.parameters.catalog}}'
              - --project-schema
              - '{{job.parameters.project_schema}}'
              - --table-prefix
              - '{{job.parameters.table_prefix}}'
              - --source-volume-name
              - '{{job.parameters.source_volume_name}}'
              - --artifacts-volume-name
              - '{{job.parameters.artifacts_volume_name}}'
              - --document-id
              - '{{input.document_id}}'
              - --parse-run-id
              - '{{input.parse_run_id}}'
              - --source-path
              - '{{input.source_path}}'
              - --image-output-path
              - '{{input.image_output_path}}'
            environment_key: default
            max_retries: 0
        depends_on:
        - task_key: load_work_manifest
      environments:
      - environment_key: default
        spec:
          environment_version: '3'
          dependencies:
          - databricks-sdk==0.133.0
          - fastapi==0.116.1
          - pydantic-settings==2.10.1
      # Queue rather than skip a run started while another is active (max_concurrent_runs: 1).
      queue:
        enabled: true
