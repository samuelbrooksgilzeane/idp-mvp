resources:
  jobs:
    document_extractor:
      name: ${var.app_name}-${bundle.target}-document-extractor
      description: Extracts registered documents using an immutable schema and parse attempt.
      max_concurrent_runs: 4
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: project_schema
          default: ${var.project_schema}
        - name: table_prefix
          default: ${var.table_prefix}
        - name: inputs
          default: "[]"
      tasks:
        - task_key: extract_document_batch
          for_each_task:
            inputs: "{{job.parameters.inputs}}"
            # Concurrency must be explicit: the default of 1 processes a batch sequentially.
            concurrency: ${var.batch_concurrency}
            task:
              task_key: extract_registered_document
              spark_python_task:
                python_file: ../src/extract_document.py
                parameters:
                  - --catalog
                  - "{{job.parameters.catalog}}"
                  - --project-schema
                  - "{{job.parameters.project_schema}}"
                  - --table-prefix
                  - "{{job.parameters.table_prefix}}"
                  - --document-id
                  - "{{input.document_id}}"
                  - --extraction-run-id
                  - "{{input.extraction_run_id}}"
                  - --schema-id
                  - "{{input.schema_id}}"
                  - --schema-version
                  - "{{input.schema_version}}"
                  - --requested-by
                  - "{{input.requested_by}}"
              environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
