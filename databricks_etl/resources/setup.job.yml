resources:
  jobs:
    workspace_setup:
      name: ${var.deployment_name}-workspace-setup
      description: >-
        Sets up or upgrades a workspace in one run: creates and migrates the tables, then grants
        the App what it uses. Safe to re-run. governed_data_bootstrap and app_access_grants stay
        runnable alone for repairs.
      tasks:
      # The bootstrap also restores the App's grants at its end (needed when it runs alone); the
      # last task grants again once the App exists.
      - task_key: bootstrap
        run_job_task:
          job_id: ${resources.jobs.governed_data_bootstrap.id}
      - task_key: grant_app_access
        depends_on:
        - task_key: bootstrap
        run_job_task:
          job_id: ${resources.jobs.app_access_grants.id}
