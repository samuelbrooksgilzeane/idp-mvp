resources:
  jobs:
    app_access_grants:
      name: ${var.deployment_name}-app-access-grants
      description: >-
        Grants the App's service principal the tables, volume, Jobs and chat agents it uses beyond
        its 20 bound resources, and the app users group CAN_USE on the App. Additive and safe to
        re-run; workspace_setup runs it last.
      tasks:
      - task_key: grant_app_access
        spark_python_task:
          python_file: ../src/grant_app_access.py
          parameters:
          - --app-name
          - ${var.deployment_name}
          - --catalog
          - ${var.catalog}
          - --project-schema
          - ${var.project_schema}
          - --table-prefix
          - ${var.table_prefix}
          - --import-volume-name
          - ${var.import_volume_name}
          - --import-job-id
          - ${resources.jobs.folder_importer.id}
          - --dispatch-job-id
          - ${resources.jobs.work_dispatcher.id}
          - --export-job-id
          - ${resources.jobs.results_exporter.id}
          - --chat-mode
          - ${var.chat_mode}
          - --chat-endpoint
          - ${var.chat_endpoint}
          - --app-users-group
          - ${var.app_users_group}
        environment_key: default
      environments:
      - environment_key: default
        spec:
          environment_version: '3'
          dependencies:
          - databricks-sdk==0.133.0
