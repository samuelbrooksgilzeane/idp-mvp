bundle:
  name: idp-mvp

include:
  - resources/*.yml

sync:
  include:
    - ../frontend/dist/**
  # A workspace Git folder has no .git, so .gitignore is not applied there; these keep generated
  # files out of every deploy. Patterns are relative to this file, hence the leading ../.
  exclude:
    - ../**/.venv/**
    - ../**/node_modules/**
    - ../**/__pycache__/**
    - ../**/.cache/**
    - ../**/.mypy_cache/**
    - ../**/.pytest_cache/**
    - ../**/.ruff_cache/**
    - ../**/.local/**
    - ../**/.databricks/**
  paths:
    - ..

variables:
  upload_parallel_transfers:
    description: Browser upload transfers in flight per batch (1-8)
    default: 3
  chat_mode:
    description: >-
      Document chat: off, knowledge_assistant (answers with page citations) or supervisor (the
      Knowledge Assistant plus SQL tools, slower). workspace_setup provisions it.
    default: knowledge_assistant
  supervisor_functions_enabled:
    description: In supervisor mode, attach the chat UC functions to the Supervisor as tools
    default: "true"
  chat_endpoint:
    description: >-
      Optional serving endpoint that answers chat instead of the provisioned one (a Supervisor,
      another agent or a specific Knowledge Assistant); blank uses the provisioned endpoint
    default: " "
  ka_sync_enabled:
    description: Request a Knowledge Assistant Sync after documents are added or deleted
    default: "true"
  viewer_projection_enabled:
    description: Enable after applying viewer projection migration and narrow grants.
    default: "false"
  bulk_export_enabled:
    description: Enable only after export tables and Job permissions are verified.
    default: "false"
  bulk_extraction_enabled:
    description: Enable durable extraction after migration and workspace verification.
    default: "false"
  auto_prepare_enabled:
    description: Enable only after queue migrations and dispatcher permissions are applied
    default: "false"
  recovery_schedule_status:
    description: PAUSED until automatic preparation is explicitly enabled
    default: PAUSED
  parse_concurrency:
    description: Maximum parser tasks in the single active parser run
    default: 3
  extraction_concurrency:
    description: Maximum extractor tasks in the single active extractor run
    default: 3
  combined_inference_concurrency:
    description: Shared parser plus extractor admission ceiling
    default: 6
  parse_dispatch_size:
    description: Work IDs per persisted parse manifest, maximum 100
    default: 100
  catalog:
    description: Existing permitted Unity Catalog catalog
  project_schema:
    description: Project schema shared by development and production targets
  table_prefix:
    description: Prefix applied to all project data objects
  source_volume_name:
    description: Existing or future source-document volume name
  artifacts_volume_name:
    description: Existing or future derived-artifact volume name
  import_volume_name:
    description: Volume users copy PDF folders into for folder import
    default: idp_import
  import_concurrency:
    description: Files registered in parallel within one folder-import run (1-32)
    default: 8
  warehouse_id:
    description: SQL warehouse identifier
  app_name:
    description: Databricks App name
    default: idp-mvp
  batch_concurrency:
    description: Documents processed in parallel within one batch job run
    default: 16

targets:
  dev:
    default: true
    mode: development
    # The live dev deployment's values (non-secret), so `databricks bundle deploy -t dev` needs no
    # --var flags. The CLI profile still chooses the workspace. Another workspace overrides these
    # with --var; prod keeps every workspace value required.
    variables:
      table_prefix: idp_dev
      catalog: workspace
      project_schema: idp_mvp
      source_volume_name: idp_source
      artifacts_volume_name: idp_artifacts
      warehouse_id: 647704f77f24020a
      viewer_projection_enabled: "true"
      chat_endpoint: mas-0297dd39-endpoint
      ka_sync_enabled: "false"
  prod:
    mode: production
    variables:
      table_prefix: idp
