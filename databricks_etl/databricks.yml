bundle:
  name: idp-mvp

include:
  - resources/*.yml

sync:
  include:
    - ../frontend/dist/**
  paths:
    - ..

variables:
  genie_enabled:
    description: Genie display configuration; see docs/GENIE_SETUP.md
    default: "false"
  genie_space_id:
    description: Genie display configuration; see docs/GENIE_SETUP.md
    default: ""
  genie_embed_url:
    description: Genie display configuration; see docs/GENIE_SETUP.md
    default: ""
  genie_workspace_origin:
    description: Genie display configuration; see docs/GENIE_SETUP.md
    default: ""
  genie_project_name:
    description: Genie display configuration; see docs/GENIE_SETUP.md
    default: "IDP project"
  viewer_projection_enabled:
    description: Enable after applying viewer projection migration and narrow grants.
    default: "false"
  bulk_export_enabled:
    description: Enable only after export tables and Job permissions are verified.
    default: "false"
  bulk_extraction_enabled:
    description: Enable durable extraction after migration and workspace verification.
    default: "false"
  auto_prepare_enabled:
    description: Enable only after queue migrations and dispatcher permissions are applied
    default: "false"
  recovery_schedule_status:
    description: PAUSED until automatic preparation is explicitly enabled
    default: PAUSED
  parse_concurrency:
    description: Maximum parser tasks in the single active parser run
    default: 1
  extraction_concurrency:
    description: Maximum extractor tasks in the single active extractor run
    default: 1
  combined_inference_concurrency:
    description: Shared parser plus extractor admission ceiling
    default: 2
  parse_dispatch_size:
    description: Work IDs per persisted parse manifest, maximum 100
    default: 100
  catalog:
    description: Existing permitted Unity Catalog catalog
  project_schema:
    description: Project schema shared by development and production targets
  table_prefix:
    description: Prefix applied to all project data objects
  source_volume_name:
    description: Existing or future source-document volume name
  artifacts_volume_name:
    description: Existing or future derived-artifact volume name
  warehouse_id:
    description: SQL warehouse identifier
  validation_endpoint:
    description: Model serving endpoint used by a future validation increment
  evaluation_experiment:
    description: MLflow experiment used by a future evaluation increment
  app_name:
    description: Databricks App name
    default: idp-mvp
  batch_concurrency:
    description: Documents processed in parallel within one batch job run
    default: 16

targets:
  dev:
    default: true
    mode: development
    variables:
      table_prefix: idp_dev
  prod:
    mode: production
    variables:
      table_prefix: idp
